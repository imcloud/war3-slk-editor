<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="../media/editor.css">
  <style>
    html, body { width: 1200px; height: 800px; }
    #harness-result {
      position: fixed; right: 0; bottom: 0; z-index: 100000;
      max-width: 900px; max-height: 300px; overflow: auto;
      background: #000; color: #0f0; font: 12px monospace; margin: 0; padding: 8px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="undo"></button>
    <button id="redo"></button>
    <button id="add-row"></button>
    <button id="add-row-end"></button>
    <button id="dup-row"></button>
    <button id="del-row"></button>
    <button id="add-col"></button>
    <button id="add-col-end"></button>
    <button id="del-col"></button>
    <input type="text" id="search-input">
    <span id="info"></span>
  </div>

  <div id="grid-wrapper">
    <div id="body-container">
      <div class="header-sticky">
        <div id="header-row" class="header-row"></div>
      </div>
      <div id="rows-area">
        <div id="phantom"></div>
        <div id="rows-layer"></div>
      </div>
    </div>
  </div>

  <div id="error-box"></div>
  <pre id="harness-result">RUNNING</pre>

  <script>
    window.__messages = [];
    window.acquireVsCodeApi = function () {
      return {
        postMessage: function (m) { window.__messages.push(m); },
        getState: function () { return null; },
        setState: function () {},
      };
    };
    window.__SLK_I18N__ = {
      'col.defaultName': 'Column {n}',
      'info.position': 'row {r} col {c} ({field})',
      'info.total': '{total} rows | {cols} cols',
      'info.selRows': '{n} rows selected',
      'info.selCols': '{n} cols selected',
      'info.selCells': '{rows}x{cols} cells',
      'menu.copy': 'Copy', 'menu.cut': 'Cut', 'menu.paste': 'Paste', 'menu.clear': 'Clear',
      'menu.insertRow': 'Insert Row', 'menu.duplicateRow': 'Duplicate',
      'menu.deleteRows': 'Delete Rows', 'menu.deleteCols': 'Delete Cols', 'menu.selectAll': 'Select All',
      'error.script': '[JS error] {message}',
    };
  </script>
  <script src="../media/gridOps.js"></script>
  <script src="../media/editor.js"></script>
  <script>
    (async function () {
      var out = [];
      var failures = 0;

      function check(name, cond, extra) {
        out.push((cond ? 'ok   ' : 'FAIL ') + name + (extra ? ' :: ' + extra : ''));
        if (!cond) failures++;
      }
      function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
      function visibleRows() {
        return Array.prototype.filter.call(
          document.querySelectorAll('#rows-layer .data-row'),
          function (r) { return r.style.display !== 'none'; }
        );
      }
      function cellEl(r, c) {
        return document.querySelector('#rows-layer .cell[data-r="' + r + '"][data-c="' + c + '"]');
      }
      function fireMouse(target, type, x, y, buttons, extra) {
        var init = { bubbles: true, button: 0, buttons: buttons, clientX: x, clientY: y };
        if (extra) for (var k in extra) init[k] = extra[k];
        target.dispatchEvent(new MouseEvent(type, init));
      }
      async function dragBetween(fromEl, toEl, opts) {
        opts = opts || {};
        var a = fromEl.getBoundingClientRect();
        var b = toEl.getBoundingClientRect();
        var mods = opts.mods || {};
        fireMouse(fromEl, 'mousedown', a.left + 8, a.top + 8, 1, mods);
        fireMouse(document, 'mousemove', a.left + 14, a.top + 14, 1, mods);
        fireMouse(document, 'mousemove', b.left + 8, b.top + 8, 1, mods);
        fireMouse(document, 'mouseup', b.left + 8, b.top + 8, 0, mods);
        await wait(20);
        // 真实浏览器在 mouseup 后还会派发一次 click，这里模拟并确认它被吞掉
        fireMouse(toEl, 'click', b.left + 8, b.top + 8, 0, mods);
        await wait(10);
      }
      function post(msg) { window.postMessage(msg, '*'); }
      function lastContentChanged() {
        for (var i = window.__messages.length - 1; i >= 0; i--) {
          if (window.__messages[i].type === 'contentChanged') return window.__messages[i];
        }
        return null;
      }

      var grid = [
        ['unitID', 'HP', 'Name'],
        ['hfoo', '420', 'Footman'],
        ['hpea', '220', 'Peasant'],
        ['hrif', '350', 'Rifleman'],
      ];

      post({ type: 'load', data: { rows: grid, maxCols: 3 } });
      await wait(80);

      check('表头渲染 3 列', document.querySelectorAll('#header-row .cell').length === 3);
      check('数据行渲染 3 行', visibleRows().length === 3, 'rendered=' + visibleRows().length);
      check('首行首格内容正确', cellEl(1, 0) && cellEl(1, 0).textContent === 'hfoo');

      // ---- mousedown 不能 preventDefault，否则 webview 永远拿不到键盘焦点 ----
      var probeRect = cellEl(1, 0).getBoundingClientRect();
      var mdCell = new MouseEvent('mousedown', {
        bubbles: true, cancelable: true, button: 0, buttons: 1,
        clientX: probeRect.left + 8, clientY: probeRect.top + 8,
      });
      cellEl(1, 0).dispatchEvent(mdCell);
      document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, buttons: 0 }));
      check('点击单元格不阻止默认焦点行为', mdCell.defaultPrevented === false);

      var probeHeader = document.querySelectorAll('#header-row .cell')[0].getBoundingClientRect();
      var mdHeader = new MouseEvent('mousedown', {
        bubbles: true, cancelable: true, button: 0, buttons: 1,
        clientX: probeHeader.left + 8, clientY: probeHeader.top + 8,
      });
      document.querySelectorAll('#header-row .cell')[0].dispatchEvent(mdHeader);
      document.dispatchEvent(new MouseEvent('mouseup', { bubbles: true, buttons: 0 }));
      check('点击列头不阻止默认焦点行为', mdHeader.defaultPrevented === false);

      // ---- 鼠标拖动框选 ----
      await dragBetween(cellEl(1, 0), cellEl(3, 1));
      check('拖动框选 3x2', document.querySelectorAll('#rows-layer .cell.cell-range').length === 6,
        'count=' + document.querySelectorAll('#rows-layer .cell.cell-range').length);
      check('拖动结束不残留 dragging 状态', !document.body.classList.contains('slk-dragging'));

      var visibleForDrag = visibleRows();
      await dragBetween(
        visibleForDrag[0].querySelector('.cell-num'),
        visibleForDrag[1].querySelector('.cell-num')
      );
      check('拖动行号选 2 行', document.querySelectorAll('#rows-layer .cell-num.row-selected').length === 2,
        'count=' + document.querySelectorAll('#rows-layer .cell-num.row-selected').length);

      await dragBetween(
        visibleForDrag[1].querySelector('.cell-num'),
        visibleForDrag[2].querySelector('.cell-num'),
        { mods: { ctrlKey: true } }
      );
      check('Ctrl+拖动行号加选到 3 行', document.querySelectorAll('#rows-layer .cell-num.row-selected').length === 3,
        'count=' + document.querySelectorAll('#rows-layer .cell-num.row-selected').length);

      var headerForDrag = document.querySelectorAll('#header-row .cell');
      await dragBetween(headerForDrag[0], headerForDrag[1]);
      check('拖动列头选 2 列', document.querySelectorAll('#header-row .cell.col-selected').length === 2,
        'count=' + document.querySelectorAll('#header-row .cell.col-selected').length);

      // 复位成单格，后续用例从干净状态开始
      cellEl(1, 0).dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(20);

      // ---- 单元格 Shift 矩形选择 ----
      cellEl(1, 0).dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(10);
      cellEl(2, 1).dispatchEvent(new MouseEvent('click', { bubbles: true, shiftKey: true }));
      await wait(10);
      check('Shift 矩形选择 2x2', document.querySelectorAll('#rows-layer .cell.cell-range').length === 4,
        'count=' + document.querySelectorAll('#rows-layer .cell.cell-range').length);

      // ---- Ctrl 多选行 ----
      var nums = visibleRows().map(function (r) { return r.querySelector('.cell-num'); });
      nums[0].dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(10);
      nums[1].dispatchEvent(new MouseEvent('click', { bubbles: true, ctrlKey: true }));
      await wait(10);
      check('Ctrl 多选 2 行', document.querySelectorAll('#rows-layer .cell-num.row-selected').length === 2,
        'count=' + document.querySelectorAll('#rows-layer .cell-num.row-selected').length);
      check('行选中时输入栏显示行数', document.getElementById('info').textContent.indexOf('2 rows selected') !== -1,
        document.getElementById('info').textContent);

      // ---- Delete 删除选中行 ----
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Delete', bubbles: true }));
      await wait(300);
      var msg = lastContentChanged();
      check('Delete 删除 2 行并上抛 contentChanged', !!msg && msg.rows.length === 2,
        msg ? 'rows=' + msg.rows.length : 'no message');
      check('删除后剩余数据正确', !!msg && msg.rows[1][0] === 'hrif',
        msg ? JSON.stringify(msg.rows) : '');

      // ---- 撤销 ----
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
      await wait(300);
      msg = lastContentChanged();
      check('Ctrl+Z 撤销恢复 3 行', !!msg && msg.rows.length === 4,
        msg ? 'rows=' + msg.rows.length : 'no message');

      // ---- 列选择 + Delete 删列 ----
      var headerCells = document.querySelectorAll('#header-row .cell');
      headerCells[2].dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(10);
      check('点击列头选中列', document.querySelectorAll('#header-row .cell.col-selected').length === 1,
        'count=' + document.querySelectorAll('#header-row .cell.col-selected').length);
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Delete', bubbles: true }));
      await wait(300);
      msg = lastContentChanged();
      check('Delete 删除 1 列', !!msg && msg.rows[0].length === 2,
        msg ? 'cols=' + msg.rows[0].length : 'no message');

      // ---- 撤销删列 ----
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
      await wait(300);
      msg = lastContentChanged();
      check('Ctrl+Z 恢复列', !!msg && msg.rows[0].length === 3,
        msg ? 'cols=' + msg.rows[0].length : 'no message');

      // ---- 粘贴 TSV ----
      cellEl(1, 0).dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(10);
      var dt = new DataTransfer();
      dt.setData('text/plain', 'X\tY\n1\t2');
      document.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dt, bubbles: true }));
      await wait(300);
      msg = lastContentChanged();
      check('粘贴 2x2 数据', !!msg && msg.rows[1][0] === 'X' && msg.rows[1][1] === 'Y' &&
        msg.rows[2][0] === '1' && msg.rows[2][1] === '2',
        msg ? JSON.stringify(msg.rows.slice(1, 3)) : 'no message');

      // ---- 撤销粘贴 ----
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
      await wait(300);
      msg = lastContentChanged();
      check('Ctrl+Z 撤销粘贴', !!msg && msg.rows[1][0] === 'hfoo',
        msg ? JSON.stringify(msg.rows[1]) : 'no message');

      // ---- 重做粘贴 ----
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'y', ctrlKey: true, bubbles: true }));
      await wait(300);
      msg = lastContentChanged();
      check('Ctrl+Y 重做粘贴', !!msg && msg.rows[1][0] === 'X',
        msg ? JSON.stringify(msg.rows[1]) : 'no message');
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'z', ctrlKey: true, bubbles: true }));
      await wait(300);

      // ---- 方向键 / Enter / 键入 ----
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'ArrowDown', bubbles: true }));
      await wait(20);
      check('方向键下移活动单元格', document.getElementById('info').textContent.indexOf('row 2') !== -1,
        document.getElementById('info').textContent);

      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'Q', bubbles: true }));
      await wait(30);
      var editorInput = document.querySelector('#rows-layer input.cell-editor');
      check('键入直接进入编辑', !!editorInput && editorInput.value === 'Q',
        editorInput ? editorInput.value : 'no input');
      if (editorInput) {
        editorInput.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
      }
      await wait(30);

      // ---- 全选 + 复制（可选，headless 下剪贴板事件可能不可用） ----
      document.dispatchEvent(new KeyboardEvent('keydown', { key: 'a', ctrlKey: true, bubbles: true }));
      await wait(20);
      check('Ctrl+A 选区覆盖全表', document.querySelectorAll('#rows-layer .cell.cell-range').length >= 9,
        'count=' + document.querySelectorAll('#rows-layer .cell.cell-range').length);

      var copyDt = new DataTransfer();
      document.dispatchEvent(new ClipboardEvent('copy', { clipboardData: copyDt, bubbles: true }));
      await wait(20);
      var copied = copyDt.getData('text/plain');
      check('Ctrl+C 复制为 TSV（不含表头行）', copied.indexOf('hfoo\t420\tFootman') === 0,
        JSON.stringify(copied.slice(0, 60)));

      // ---- 行/列头右键：粘贴起点必须是第 1 列 / 第 1 行 ----
      post({ type: 'load', data: { rows: grid, maxCols: 3 } });
      await wait(80);

      var rowNums = visibleRows().map(function (r) { return r.querySelector('.cell-num'); });
      rowNums[1].dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(10);
      check('点击行号后活动格落在第 1 列',
        document.getElementById('info').textContent.indexOf('row 2 col 1') !== -1,
        document.getElementById('info').textContent);

      rowNums[2].dispatchEvent(new MouseEvent('contextmenu', {
        bubbles: true, cancelable: true, button: 2, clientX: 420, clientY: 260,
      }));
      await wait(10);
      check('右键行号弹出菜单', document.getElementById('slk-context-menu').style.display === 'block');
      check('右键行号后粘贴起点为第 3 行第 1 列',
        document.getElementById('info').textContent.indexOf('row 3 col 1') !== -1,
        document.getElementById('info').textContent);

      document.body.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(10);

      var dtRow = new DataTransfer();
      dtRow.setData('text/plain', 'X\tY');
      document.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dtRow, bubbles: true }));
      await wait(300);
      var msgRow = lastContentChanged();
      check('行号右键粘贴从第 1 列开始',
        !!msgRow && msgRow.rows[3][0] === 'X' && msgRow.rows[3][1] === 'Y',
        msgRow ? JSON.stringify(msgRow.rows[3]) : 'no message');

      post({ type: 'load', data: { rows: grid, maxCols: 3 } });
      await wait(80);
      var hcells = document.querySelectorAll('#header-row .cell');
      hcells[1].dispatchEvent(new MouseEvent('contextmenu', {
        bubbles: true, cancelable: true, button: 2, clientX: 520, clientY: 20,
      }));
      await wait(10);
      check('右键列头弹出菜单', document.getElementById('slk-context-menu').style.display === 'block');
      check('右键列头后粘贴起点为第 1 行第 2 列',
        document.getElementById('info').textContent.indexOf('row 1 col 2') !== -1,
        document.getElementById('info').textContent);

      document.body.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(10);

      var dtCol = new DataTransfer();
      dtCol.setData('text/plain', 'Z');
      document.dispatchEvent(new ClipboardEvent('paste', { clipboardData: dtCol, bubbles: true }));
      await wait(300);
      var msgCol = lastContentChanged();
      check('列头右键粘贴从第 1 行开始',
        !!msgCol && msgCol.rows[1][1] === 'Z',
        msgCol ? JSON.stringify(msgCol.rows[1]) : 'no message');

      // ---- 右键 Duplicate Row 必须是插入整行副本，而不是向下覆盖 ----
      post({ type: 'load', data: { rows: grid, maxCols: 3 } });
      await wait(80);
      var dupCell = cellEl(1, 0);
      var dupRect = dupCell.getBoundingClientRect();
      dupCell.dispatchEvent(new MouseEvent('contextmenu', {
        bubbles: true, cancelable: true, button: 2,
        clientX: dupRect.left + 8, clientY: dupRect.top + 8,
      }));
      await wait(10);
      var dupItem = document.querySelector('#slk-context-menu [data-menu-key="duplicateRow"]');
      check('单元格右键菜单包含 Duplicate Row', !!dupItem);
      if (dupItem) dupItem.dispatchEvent(new MouseEvent('click', { bubbles: true }));
      await wait(300);
      var msgDup = lastContentChanged();
      check('右键 Duplicate Row 插入整行副本',
        !!msgDup && msgDup.rows.length === 5 &&
          msgDup.rows[2][0] === 'hfoo' && msgDup.rows[2][2] === 'Footman' &&
          msgDup.rows[3][0] === 'hpea',
        msgDup ? JSON.stringify(msgDup.rows) : 'no message');

      check('未触发 JS 错误遮罩', document.getElementById('error-box').style.display !== 'block',
        document.getElementById('error-box').textContent);

      var summary = failures === 0 ? 'ALL PASS (' + out.length + ')' : failures + ' FAILED';
      document.getElementById('harness-result').textContent =
        summary + '\n' + out.join('\n');
      document.title = summary;
    })().catch(function (e) {
      document.getElementById('harness-result').textContent = 'HARNESS ERROR: ' + (e && e.stack ? e.stack : e);
      document.title = 'HARNESS ERROR';
    });
  </script>
</body>
</html>
